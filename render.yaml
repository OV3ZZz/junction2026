# Render Blueprint: one Docker web service for API + frontend.
# The Exa key is entered in the Render dashboard (sync: false) and never stored in git.
services:
  - type: web
    name: WorkHunter
    runtime: docker
    # The free plan sleeps after ~15 min idle and needs ~1 min to wake up.
    # Switch to "starter" for judging so the demo link answers immediately.
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: EXA_API_KEY
        sync: false
      - key: MAX_SEARCHES_PER_HOUR
        value: "120"
