[project]
name = "job-search-backend"
version = "0.1.0"
description = "Exa-powered job search API"
requires-python = ">=3.11"
dependencies = [
  "exa-py>=1.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
